<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      background: #0f1117;
      color: #e1e4eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    h1 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .stats { display: flex; gap: 12px; margin-bottom: 12px; }
    .stat { background: #1a1d27; border: 1px solid #2a2e3a; border-radius: 8px; padding: 8px 12px; flex: 1; text-align: center; }
    .stat-num { font-size: 20px; font-weight: 700; color: #6c8cff; }
    .stat-label { font-size: 10px; color: #959bb0; margin-top: 2px; }
    .add-box { display: flex; gap: 6px; margin-bottom: 12px; }
    input {
      flex: 1; background: #1a1d27; border: 1px solid #2a2e3a; border-radius: 6px;
      color: #e1e4eb; padding: 8px 10px; font-size: 13px; outline: none;
    }
    input:focus { border-color: #6c8cff; }
    button {
      background: linear-gradient(135deg, #6c8cff, #4a6cf7);
      border: none; border-radius: 6px; color: #fff; padding: 8px 14px;
      cursor: pointer; font-size: 13px; font-weight: 500;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { font-size: 11px; color: #959bb0; margin-bottom: 8px; }
    .result { background: #1a1d27; border-radius: 8px; padding: 10px; margin-top: 8px; display: none; }
    .result.show { display: block; }
    .result-word { font-size: 15px; font-weight: 600; color: #6c8cff; }
    .result-trans { margin-top: 4px; }
    .result-example { margin-top: 6px; color: #959bb0; font-size: 11px; font-style: italic; border-top: 1px solid #2a2e3a; padding-top: 6px; }
    .links { display: flex; gap: 8px; margin-top: 12px; }
    .links a { color: #6c8cff; text-decoration: none; font-size: 12px; }
    .links a:hover { text-decoration: underline; }
    .msg { padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 6px; display: none; }
    .msg.show { display: block; }
    .msg-ok { background: rgba(74,222,128,0.15); color: #4ade80; }
    .msg-err { background: rgba(248,113,113,0.15); color: #f87171; }
  </style>
</head>
<body>
  <h1>⚡ 灵闪单词</h1>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-total">-</div><div class="stat-label">词汇总量</div></div>
    <div class="stat"><div class="stat-num" id="stat-learning">-</div><div class="stat-label">学习中</div></div>
    <div class="stat"><div class="stat-num" id="stat-today">-</div><div class="stat-label">今日新增</div></div>
  </div>
  <div class="hint">输入单词或短语，一键添加并翻译：</div>
  <div class="add-box">
    <input type="text" id="word-input" placeholder="输入英文单词或短语...">
    <button id="add-btn">添加</button>
  </div>
  <div class="msg msg-ok" id="msg-ok"></div>
  <div class="msg msg-err" id="msg-err"></div>
  <div class="result" id="result">
    <div class="result-word" id="r-word"></div>
    <div class="result-trans" id="r-trans"></div>
    <div class="result-example" id="r-example"></div>
  </div>
  <div class="links">
    <a href="#" id="open-panel">📚 打开学习面板</a>
    <a href="#" id="open-vocab">📋 词汇管理</a>
  </div>

  <script src="lib/storage.js"></script>
  <script>
    // Load stats
    async function loadStats() {
      const res = await chrome.runtime.sendMessage({ action: 'getStats' });
      if (res) {
        document.getElementById('stat-total').textContent = res.total;
        document.getElementById('stat-learning').textContent = res.learning;
        document.getElementById('stat-today').textContent = res.addedToday;
      }
    }
    loadStats();

    // Add word
    document.getElementById('add-btn').addEventListener('click', addWord);
    document.getElementById('word-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addWord();
    });

    async function addWord() {
      const input = document.getElementById('word-input');
      const word = input.value.trim();
      if (!word) return;

      const btn = document.getElementById('add-btn');
      btn.disabled = true;
      btn.textContent = '...';
      hideMsgs();

      try {
        const res = await chrome.runtime.sendMessage({ action: 'addWord', word });
        if (res.error) throw new Error(res.error);

        if (res.alreadyExists) {
          showMsg('msg-ok', '该词已在词汇表中 ✓');
        } else {
          showMsg('msg-ok', '已添加 ✓');
        }

        // Show result
        if (res.info) {
          const r = document.getElementById('result');
          r.classList.add('show');
          document.getElementById('r-word').textContent = res.info.word + (res.info.phonetic ? '  ' + res.info.phonetic : '');
          document.getElementById('r-trans').textContent = res.info.translation;
          document.getElementById('r-example').textContent = res.info.example
            ? `"${res.info.example}" — ${res.info.exampleTranslation}`
            : '';
        }

        input.value = '';
        loadStats();
      } catch (e) {
        showMsg('msg-err', '失败: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '添加';
      }
    }

    function showMsg(id, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.classList.add('show');
    }
    function hideMsgs() {
      document.querySelectorAll('.msg').forEach(m => m.classList.remove('show'));
    }

    // Links
    document.getElementById('open-panel').addEventListener('click', (e) => {
      e.preventDefault();
      chrome.tabs.query({ active: true, currentWindow: true }, ([tab]) => {
        chrome.sidePanel.open({ windowId: tab.windowId });
      });
    });
    document.getElementById('open-vocab').addEventListener('click', (e) => {
      e.preventDefault();
      chrome.tabs.query({ active: true, currentWindow: true }, ([tab]) => {
        chrome.sidePanel.open({ windowId: tab.windowId });
      });
    });
  </script>
</body>
</html>
